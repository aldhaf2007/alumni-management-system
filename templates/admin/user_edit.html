{% extends "base_dashboard.html" %}
{% block title %}Edit User | ABC University{% endblock %}
{% block page_heading %}Edit User{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h2>Edit User: {{ user.name }}</h2>
    <a href="{{ url_for('admin.manage_users') }}" class="btn btn-outline" style="float: right; margin-top: -40px;">Back to Users</a>
</div>

<div class="card" style="padding: 2.5rem; max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" value="{{ user.name }}" required>
        </div>
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" value="{{ user.email }}" required>
        </div>
        <div class="form-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
                <option value="student" {% if user.role == 'student' %}selected{% endif %}>Student</option>
                <option value="alumni" {% if user.role == 'alumni' %}selected{% endif %}>Alumni</option>
                <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
            </select>
        </div>
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                <option value="Approved" {% if user.status == 'Approved' %}selected{% endif %}>Approved</option>
                <option value="Pending" {% if user.status == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Rejected" {% if user.status == 'Rejected' %}selected{% endif %}>Rejected</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update User</button>
    </form>
</div>
{% endblock %}
