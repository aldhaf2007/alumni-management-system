{% extends "base_dashboard.html" %}
{% block title %}Edit Event | Aringar Anna College{% endblock %}
{% block page_heading %}Edit Event{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h2>Edit Event</h2>
    <a href="{{ url_for('events.list_events') }}" class="btn btn-outline" style="float: right;">Back to Events</a>
    <div style="clear: both;"></div>
</div>

<div class="card glass" style="padding: 2.5rem; max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('events.edit_event', event_id=event.id) }}" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" name="title" required value="{{ event.title }}">
        </div>
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required value="{{ event.date.strftime('%Y-%m-%d') if event.date else '' }}">
        </div>
        <div class="form-group">
            <label for="time">Time</label>
            <input type="time" id="time" name="time" required value="{{ event.time.strftime('%H:%M') if event.time else '' }}">
        </div>
        <div class="form-group">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" required value="{{ event.location }}">
        </div>
        <div class="form-group">
            <label for="image">Event Banner Image (Leave empty to keep current)</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        <div class="form-group">
            <label for="description">Event Description</label>
            <textarea id="description" name="description" rows="5" required>{{ event.description }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Update Event</button>
    </form>
</div>
{% endblock %}
