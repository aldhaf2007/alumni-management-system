{% extends "base_dashboard.html" %}
{% block title %}Edit Announcement | Aringar Anna College{% endblock %}
{% block page_heading %}Edit Announcement{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h2>Edit Announcement</h2>
    <a href="{{ url_for('events.list_announcements') }}" class="btn btn-outline" style="float: right;">Back to Announcements</a>
    <div style="clear: both;"></div>
</div>

<div class="card glass" style="padding: 2.5rem; max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('events.edit_announcement', ann_id=announcement.id) }}">
        <div class="form-group">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required value="{{ announcement.title }}">
        </div>
        <div class="form-group">
            <label for="type">Type</label>
            <select id="type" name="type" required>
                <option value="News" {% if announcement.type == 'News' %}selected{% endif %}>News</option>
                <option value="Notice" {% if announcement.type == 'Notice' %}selected{% endif %}>Notice</option>
                <option value="Event" {% if announcement.type == 'Event' %}selected{% endif %}>Event</option>
            </select>
        </div>
        <div class="form-group">
            <label for="content">Content</label>
            <textarea id="content" name="content" rows="6" required>{{ announcement.content }}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Update Announcement</button>
    </form>
</div>
{% endblock %}
