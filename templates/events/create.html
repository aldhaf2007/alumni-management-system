{% extends "base_dashboard.html" %}
{% block title %}Create Event | ABC University{% endblock %}
{% block page_heading %}Schedule Event{% endblock %}

{% block content %}
<div class="dashboard-header">
    <h2>Schedule an Event</h2>
    <a href="{{ url_for('events.list_events') }}" class="btn btn-outline" style="float: right;">Back to Events</a>
    <div style="clear: both;"></div>
</div>

<div class="card" style="padding: 2.5rem; max-width: 600px; margin: 0 auto;">
    <form method="POST" action="{{ url_for('events.create_event') }}">
        <div class="form-group">
            <label for="title">Event Title</label>
            <input type="text" id="title" name="title" required>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="time">Time</label>
                <input type="time" id="time" name="time" required>
            </div>
        </div>
        <div class="form-group">
            <label for="location">Location or Meeting Link</label>
            <input type="text" id="location" name="location" required>
        </div>
        <div class="form-group">
            <label for="description">Event Details</label>
            <textarea id="description" name="description" rows="5" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Create Event</button>
    </form>
</div>
{% endblock %}
